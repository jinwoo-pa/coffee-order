<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신앙상담</title>
<style>
:root{font-family:Circular,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#222;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,680px);padding:32px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px,rgba(0,0,0,.1) 0 4px 8px}.head{display:flex;justify-content:space-between;gap:16px;align-items:start}.eyebrow{margin:0;color:#6a6a6a;font-size:12px;font-weight:700;letter-spacing:.32px}.reset{width:auto;min-height:40px;margin:0;padding:8px 14px;border:1px solid #222;border-radius:8px;background:#fff;color:#222;font-size:14px;font-weight:500;cursor:pointer}h1{margin:8px 0;font-size:28px;line-height:1.3}label{display:block;margin:24px 0 8px;font-weight:600}textarea{width:100%;min-height:180px;padding:14px 12px;border:1px solid #ddd;border-radius:8px;font:inherit;resize:vertical}textarea:focus{outline:0;border:2px solid #222;padding:13px 11px}button{width:100%;min-height:48px;margin-top:16px;padding:14px 24px;border:0;border-radius:8px;background:#ff385c;color:#fff;font:inherit;font-weight:500;cursor:pointer}button:disabled{background:#ffd1da;cursor:wait}.answer{margin-top:28px;padding:20px;background:#f7f7f7;border-radius:14px}.answer h2{margin:0 0 8px;font-size:20px}.answer p{margin:0;white-space:pre-wrap;line-height:1.7}@media(max-width:520px){body{padding:0}.card{min-height:100vh;border:0;border-radius:0;padding:24px}.head{align-items:center}h1{font-size:24px}}
</style>
</head>
<body><main class="card"><div class="head"><div><p class="eyebrow">FAITH COUNSELING</p><h1>마음을 나누어 주세요</h1></div><button id="reset-button" class="reset" type="button">새 상담</button></div><form id="counseling-form"><label for="message">상담 내용</label><textarea id="message" required placeholder="지금 마음에 있는 이야기를 적어 주세요."></textarea><button id="send-button">상담 보내기</button></form><section class="answer" aria-live="polite"><h2>상담 결과</h2><p id="answer">상담 내용을 보내면 이곳에 답변이 표시됩니다.</p></section></main><script>
const url="https://n8n.revparkjw.top/webhook/af8097bd-65bf-4cc2-81a9-b3d270e44b41",form=document.querySelector("#counseling-form"),message=document.querySelector("#message"),button=document.querySelector("#send-button"),answer=document.querySelector("#answer"),reset=document.querySelector("#reset-button"),initial="상담 내용을 보내면 이곳에 답변이 표시됩니다.";
reset.addEventListener("click",()=>{message.value="";answer.textContent=initial;message.focus()});
form.addEventListener("submit",async e=>{e.preventDefault();const text=message.value.trim();if(!text){answer.textContent="상담 내용을 입력해 주세요.";return}button.disabled=true;answer.textContent="상담 내용을 전송하고 있습니다…";try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});if(!r.ok)throw Error();const data=await r.json();if(typeof data.answer!=="string"||!data.answer.trim())throw Error();answer.textContent=data.answer}catch{answer.textContent="상담 결과를 받지 못했습니다. 잠시 후 다시 시도해 주세요."}finally{button.disabled=false}});
</script></body></html>
