<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신앙상담</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1e2a24;background:#f7f4ed}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,680px);padding:36px;background:#fffefd;border-radius:20px;box-shadow:0 16px 40px #23351d1a}.eyebrow{color:#46624f;font-size:.8rem;font-weight:700;letter-spacing:.12em}label{display:block;margin:24px 0 8px;font-weight:700}textarea{width:100%;min-height:180px;padding:14px;border:1px solid #b8c4b4;border-radius:10px;box-sizing:border-box;font:inherit;resize:vertical}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#3e6044;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.answer{margin-top:28px;padding:20px;background:#f0f4ed;border-radius:12px}#answer{white-space:pre-wrap;line-height:1.7}
</style>
</head>
<body><main class="card"><p class="eyebrow">FAITH COUNSELING</p><h1>마음을 나누어 주세요</h1><form id="counseling-form"><label for="message">상담 내용</label><textarea id="message" required placeholder="지금 마음에 있는 이야기를 적어 주세요."></textarea><button id="send-button">상담 보내기</button></form><section class="answer" aria-live="polite"><h2>상담 결과</h2><p id="answer">상담 내용을 보내면 이곳에 답변이 표시됩니다.</p></section></main><script>
const url="https://n8n.revparkjw.top/webhook/af8097bd-65bf-4cc2-81a9-b3d270e44b41",form=document.querySelector("#counseling-form"),message=document.querySelector("#message"),button=document.querySelector("#send-button"),answer=document.querySelector("#answer");
form.addEventListener("submit",async e=>{e.preventDefault();const text=message.value.trim();if(!text){answer.textContent="상담 내용을 입력해 주세요.";return}button.disabled=true;answer.textContent="상담 내용을 전송하고 있습니다…";try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});if(!r.ok)throw Error();const data=await r.json();if(typeof data.answer!=="string"||!data.answer.trim())throw Error();answer.textContent=data.answer}catch{answer.textContent="상담 결과를 받지 못했습니다. 잠시 후 다시 시도해 주세요."}finally{button.disabled=false}});
</script></body></html>
