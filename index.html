<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n 에이전트 챗봇</title>
    <style>
        :root {
            --page-bg: #eef3f0;
            --panel-bg: #ffffff;
            --panel-border: #d9e3dd;
            --header-bg: #1f5f54;
            --header-accent: #a9d6c3;
            --text-main: #1f2933;
            --text-muted: #6b7a73;
            --agent-bg: #f4f7f5;
            --user-bg: #d9f2df;
            --user-border: #b8dec1;
            --button-bg: #2f7d68;
            --button-hover: #286b5a;
            --danger-bg: #fff0f0;
            --danger-border: #e4a7a7;
            --danger-text: #a22424;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        body {
            font-family: "Segoe UI", "Noto Sans KR", Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(135deg, rgba(31, 95, 84, 0.12), transparent 42%),
                linear-gradient(315deg, rgba(169, 214, 195, 0.24), transparent 44%),
                var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            
            min-height: 100dvh; 
            min-height: 100vh;

            padding-top: constant(safe-area-inset-top);
            padding-top: env(safe-area-inset-top);
            padding-bottom: constant(safe-area-inset-bottom);
            padding-bottom: env(safe-area-inset-bottom);
            flex-direction: column; 
        }

        .chat-container {
            width: min(100%, clamp(360px, 92vw, 960px));
            height: min(100%, 100dvh);
            min-height: 0;
            border: 1px solid var(--panel-border);
            box-shadow: 0 22px 60px rgba(24, 49, 43, 0.16);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--panel-bg);
            margin: 0;
        }
        
        @media (max-width: 640px) {
            .chat-container {
                width: 100%;
                height: 100%;
                border: 0;
                box-shadow: none;
                border-radius: 0;
            }
        }
        
        .chat-header {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 36%),
                var(--header-bg);
            color: white;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            margin: 0;
            font-size: clamp(1.05rem, 2vw, 1.3rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .header-subtitle {
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.78);
            font-size: 0.88rem;
            line-height: 1.35;
        }

        .status-badge {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #edf8f3;
            font-size: 0.86rem;
            white-space: nowrap;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--header-accent);
            box-shadow: 0 0 0 4px rgba(169, 214, 195, 0.16);
        }

        .chat-box {
            flex-grow: 1;
            min-height: 0;
            padding: 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background:
                linear-gradient(180deg, rgba(244, 247, 245, 0.75), rgba(255, 255, 255, 0.92));
        }

        .message {
            max-width: min(78%, 680px);
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.55;
            word-wrap: break-word;
            opacity: 1;
            transition: opacity 0.5s ease;
            box-shadow: 0 8px 20px rgba(31, 41, 51, 0.06);
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-bg);
            border: 1px solid var(--user-border);
            color: var(--text-main);
            border-bottom-right-radius: 5px;
        }

        .agent-message {
            align-self: flex-start;
            background-color: var(--agent-bg);
            border: 1px solid #e2e9e5;
            color: var(--text-main);
            border-bottom-left-radius: 5px;
        }
        
        .error-message {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            white-space: pre-wrap;
            font-size: 0.9em;
        }
        
        .loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 1px;
            border-radius: 50%;
            background-color: var(--text-muted);
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid #e6eee9;
            background-color: rgba(255, 255, 255, 0.96);
        }

        .input-area input {
            flex-grow: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid #cfdad4;
            border-radius: 12px;
            font-size: 1em;
            outline: none;
            color: var(--text-main);
            background-color: #fbfdfc;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--button-bg);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(47, 125, 104, 0.12);
        }

        .input-area button {
            flex: 0 0 auto;
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 13px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
            transition: background-color 0.3s, transform 0.1s;
        }

        .input-area button:hover {
            background-color: var(--button-hover);
        }
        
        .input-area button:active {
            transform: scale(0.98);
        }

        .input-area button:disabled {
            cursor: not-allowed;
            background-color: #aebbb5;
            color: rgba(255, 255, 255, 0.82);
        }

        @media (max-width: 640px) {
            .chat-header {
                padding: 16px;
                align-items: flex-start;
            }

            .header-subtitle {
                font-size: 0.82rem;
            }

            .status-badge {
                font-size: 0.78rem;
            }

            .chat-box {
                padding: 16px;
            }

            .message {
                max-width: 88%;
            }

            .input-area {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div>
            <h1 class="header-title">목회관리 AI 비서</h1>
            <div class="header-subtitle">필요한 내용을 편하게 물어보세요</div>
        </div>
        <div class="status-badge"><span class="status-dot"></span>온라인</div>
    </div>
    <div class="chat-box" id="chatBox">
        <!-- 초기 환영 메시지 -->
        <div class="message agent-message">안녕하세요. 무엇을 도와드릴까요?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="메시지를 입력하세요..." autofocus>
        <button id="sendButton" disabled>전송</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    
    // 🌟 사용자가 제공한 n8n 웹훅 URL
    const WEBHOOK_URL = 'https://n8n.revparkjw.top/webhook/96fd32ab-f9c2-4c8e-b965-57a8f734a5a1/chat';

    // 💡 세션 ID를 저장할 변수
    let currentSessionId = null; 

    // UUID를 생성하는 간단한 fallback 함수
    function generateUUID() {
      // 간단한 UUID 생성 로직 (crypto.randomUUID가 없는 환경 대비)
      let dt = new Date().getTime();
      let uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        let r = (dt + Math.random() * 16) % 16 | 0;
        dt = Math.floor(dt / 16);
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
      return uuid;
    }

    function ensureSessionId() {
        if (!currentSessionId) {
            // crypto.randomUUID가 있으면 사용하고, 없으면 fallback 함수 사용
            currentSessionId = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : generateUUID();
            console.log("Session ID generated for this session:", currentSessionId);
        }
    }
    
    // 🌟 간단한 마크다운을 HTML로 변환합니다.
    function simpleMarkdownToHtml(markdown) {
        // 1. 줄 바꿈 (\n)을 HTML <br> 태그로 변환 (목록 가독성 향상)
        let html = markdown.replace(/\n/g, '<br>');
        
        // 2. 볼드체 (**text**)를 HTML <b>text</b>로 변환
        html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

        return html;
    }


    // 메시지를 채팅창에 추가하는 함수
    function addMessage(content, sender, isRawHtml = false, isError = false) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.classList.add(sender === 'user' ? 'user-message' : 'agent-message');
        
        if (isError) {
            messageDiv.classList.add('error-message');
        }
        
        if (isError) {
            // 오류 메시지는 텍스트 그대로 표시
            messageDiv.textContent = content;
        } else if (isRawHtml) {
            // 로딩 스피너 등 미리 정의된 HTML은 그대로 표시
            messageDiv.innerHTML = content;
        } else if (sender === 'agent') {
            // 🌟 에이전트 메시지는 마크다운 변환 후 HTML로 표시
            messageDiv.innerHTML = simpleMarkdownToHtml(content);
        } else {
            // 사용자 메시지 등 일반 텍스트는 텍스트 그대로 표시
            messageDiv.textContent = content;
        }
        
        chatBox.appendChild(messageDiv);
        
        // 스크롤을 맨 아래로 이동
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }

    // 로딩 메시지(점 3개 애니메이션)를 표시하는 함수
    function showLoadingMessage() {
        const loadingContent = `
            답변 생성 중
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        `;
        return addMessage(loadingContent, 'agent', true);
    }

    function parseN8nResponseBody(bodyText) {
        const trimmedBody = bodyText.trim();
        if (!trimmedBody) return '';

        try {
            const data = JSON.parse(trimmedBody);
            return data.output || data.text || JSON.stringify(data, null, 2);
        } catch {
            const chunks = trimmedBody
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => {
                    try {
                        return JSON.parse(line);
                    } catch {
                        return null;
                    }
                })
                .filter(item => item && item.type === 'item' && typeof item.content === 'string')
                .map(item => item.content);

            return chunks.length > 0 ? chunks.join('') : trimmedBody;
        }
    }
    
    // 메시지 입력 상태 확인 및 버튼 활성화/비활성화
    function checkInput() {
        sendButton.disabled = userInput.value.trim() === '';
    }
    
    // 초기 버튼 상태 설정
    checkInput();
    userInput.addEventListener('input', checkInput);


    // 메시지 전송 및 n8n 웹훅 호출
    async function sendMessage() {
        const message = userInput.value.trim();
        if (message === '') return;
        
        // 1. 사용자 메시지 표시
        addMessage(message, 'user');
        userInput.value = ''; // 입력창 비우기
        checkInput(); // 버튼 비활성화

        // 2. 로딩 메시지 표시
        const loadingMessageDiv = showLoadingMessage();
        
        // 입력 및 버튼 비활성화
        userInput.disabled = true;
        sendButton.disabled = true;

        // 🚨 세션 ID가 있는지 확인 및 생성 (안전 장치)
        ensureSessionId();

        let agentResponseText = '';
        let isError = false;

        try {
            // 3. n8n 웹훅으로 메시지 전송
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                // 'chatInput'과 'sessionId'를 함께 보냅니다.
                body: JSON.stringify({ 
                    chatInput: message, 
                    sessionId: currentSessionId 
                }),
            });
            
            const responseText = await response.text();

            if (!response.ok) {
                isError = true;
                agentResponseText = `🚨 n8n 서버 오류 (상태: ${response.status})\n\n[오류 내용]\n${parseN8nResponseBody(responseText)}`;
            } else {
                agentResponseText = parseN8nResponseBody(responseText);
            }

        } catch (error) {
            // 이 catch 블록은 네트워크 오류나 예상치 못한 오류를 처리합니다.
            console.error('Network or unexpected error:', error);
            agentResponseText = `죄송합니다. 네트워크 연결 또는 예상치 못한 오류가 발생했습니다. (콘솔 확인)`;
            isError = true;
        } finally {
            // 5. 로딩 메시지를 실제 응답으로 대체
            loadingMessageDiv.remove(); // 이전 로딩 메시지 제거
            addMessage(agentResponseText, 'agent', false, isError);
            
            // 6. 입력 및 버튼 다시 활성화
            userInput.disabled = false;
            userInput.focus(); // 다시 입력할 수 있도록 포커스 이동
            checkInput(); // 입력 값에 따라 버튼 상태 업데이트
        }
    }

    // Event Listeners
    sendButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !sendButton.disabled) {
            sendMessage();
        }
    });
    
    // 💡 페이지 로드 시 세션 ID를 초기화합니다.
    ensureSessionId();

</script>

</body>
</html>
